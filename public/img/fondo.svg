<svg width="100%" height="100%" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Blur para suavizar -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- Gradientes -->
    <radialGradient id="yellowGrad">
      <stop offset="0%" stop-color="#F6D88C" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F6D88C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGrad">
      <stop offset="0%" stop-color="#D8F2B0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D8F2B0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGrad">
      <stop offset="0%" stop-color="#F7B3C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F7B3C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Mancha amarilla -->
  <circle cx="1100" cy="120" r="350" fill="url(#yellowGrad)" filter="url(#blur)"/>

  <!-- Mancha verde -->
  <circle cx="250" cy="420" r="320" fill="url(#greenGrad)" filter="url(#blur)"/>

  <!-- Mancha rosa -->
  <circle cx="1050" cy="720" r="360" fill="url(#pinkGrad)" filter="url(#blur)"/>

</svg>